<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IKIGAI CLOTHING | Login</title>
        <link rel="stylesheet" href="login.css">
        <script src="login.js" defer></script>

    </head>
    <body>

        <div class="auth-shell">
            <div class="auth-card">
                <a class="back-link" href="index.html">← Back to home</a>
                <h1 id="authTitle">Welcome back</h1>
                <p id="authSubtitle">Log in to continue shopping.</p>

                <form id="authForm">
                    <div class="field" id="nameField" hidden>
                        <label for="name">Full name</label>
                        <input id="name" name="name" type="text" placeholder="Your name">
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
                </form>

                <p class="switch-copy">
                    <span id="switchText">New here?</span>
                    <button type="button" class="link-btn" id="toggleModeBtn">Create an account</button>
                </p>
                <p id="messageBox" class="message" aria-live="polite"></p>
            </div>
        </div>

    </body>
</html>
